{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Notes App</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to access your private notes.</p>

            {% if form.errors %}
                <div class="error-box">Please correct the highlighted fields and try again.</div>
            {% endif %}

            <form class="auth-form" method="post" action="{% url 'login' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="auth-btn auth-btn-primary" type="submit">Sign In</button>
            </form>

            <p class="auth-note">
                Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
            </p>
        </section>
    </main>
</body>
</html>
